[package]
name = "tsfm-prediction"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Time-series forecasting service for NebulaHome, a native Rust port of Mistral AI's Timestral"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
gemm = "0.18"
memmap2 = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
ureq = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
