# Builds the image and pushes it to Docker Hub as nebulahome/tsfm-prediction when a tag
# `v<version>` is pushed: `v0.1.0` gives the image `0.1.0`, which Energy's `minVersion` and the
# platform's supervisor read as a plain release. Until an image is there the supervisor cannot pull
# it, and Energy's forecast stays "starting". The Docker Hub repository must be public: an
# installation pulls it without a token. Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
# arm64 is built under QEMU, so the first build is slow; the layer cache makes the next ones quick.
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag is the crate's version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, Cargo.toml says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: nebulahome/tsfm-prediction:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/nebulahome/tsfm-prediction
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
